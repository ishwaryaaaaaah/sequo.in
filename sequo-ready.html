  <title>Sequo – Know What To Do Next</title>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' }

      }

  </style>
</head>
<body class="bg-slate-50 text-slate-800">

      </div>
    </div>
  </header>

  <!-- HOME PAGE -->
  <div id="homePage">
    <!-- Hero -->
    <section class="relative overflow-hidden bg-gradient-to-br from-teal-700 via-teal-600 to-emerald-700 text-white">
      <div class="absolute inset-0 opacity-20">
        <div class="absolute -top-20 -left-20 w-80 h-80 bg-white rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-300 rounded-full blur-3xl"></div>
      </div>
      <div class="relative max-w-6xl mx-auto px-4 py-14 md:py-18">
        <div class="max-w-2xl">
          <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur px-3 py-1 rounded-full text-sm font-medium mb-5 border border-white/10">
            <span class="w-2 h-2 bg-emerald-300 rounded-full animate-pulse"></span>
            Built for first-timers in India
          </div>
          <h1 class="text-3xl md:text-5xl font-extrabold leading-tight mb-4">Know exactly<br>what to do next</h1>
          <p class="text-teal-100 text-lg mb-8 max-w-lg">Clear step-by-step guides for train stations, hospitals, passport offices, malls and more.</p>
          <div class="relative max-w-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

          </div>
        </div>
      </div>
    </section>

    <!-- Categories -->
    <section class="max-w-6xl mx-auto px-4 py-10">

    </section>

    <!-- Guides -->
    <section class="max-w-6xl mx-auto px-4 pb-16">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold" id="guidesTitle">Popular guides</h2>
        <span class="text-sm text-slate-500" id="guidesCount"></span>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5" id="guidesGrid"></div>
    </section>
  </div>

  <!-- GUIDE DETAIL PAGE -->
  <div id="guidePage" class="hidden max-w-3xl mx-auto px-4 py-8">
    <button onclick="showHome()" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-teal-700 mb-6">
      <i class="fa-solid fa-arrow-left"></i> All guides
    </button>
    <div id="guideDetail"></div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm" style="display:none">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative fade-in" id="authBox">
      <!-- content injected -->
    </div>
  </div>

  <!-- FOOTER -->

        </div>

      <div class="text-sm text-slate-400">© 2026 Sequo</div>
    </div>

let activeCategory = null;

function renderCategories() {
  document.getElementById('categoriesGrid').innerHTML = categories.map(cat => `
    <button onclick="filterByCategory('${cat.id}')" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md text-left ${activeCategory === cat.id ? 'ring-2 ring-teal-500 bg-teal-50' : ''}">
      <div class="w-11 h-11 rounded-xl ${cat.color} flex items-center justify-center text-xl mb-3">${cat.emoji}</div>
      <span class="font-semibold text-sm">${cat.name}</span>
    </button>
  `).join('');
}

function renderGuides(list) {
  const title = document.getElementById('guidesTitle');
  const count = document.getElementById('guidesCount');
  title.textContent = activeCategory ? (categories.find(c => c.id === activeCategory)?.name || 'Guides') : 'Popular guides';
  count.textContent = list.length + ' guide' + (list.length !== 1 ? 's' : '');

  document.getElementById('guidesGrid').innerHTML = list.length === 0 
    ? '<p class="text-slate-500 col-span-full text-center py-16">No guides found.</p>'
    : list.map(g => {
        const cat = categories.find(c => c.id === g.category);
        return `
          <article onclick="openGuide('${g.id}')" class="guide-card bg-white rounded-2xl border border-slate-100 shadow-sm cursor-pointer overflow-hidden">
            <div class="h-44 relative overflow-hidden">
              <img src="${g.image}" alt="${g.title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800&q=80'">
              <div class="absolute inset-0 bg-gradient-to-t from-black/55 to-transparent"></div>
              <span class="absolute bottom-3 left-3 text-xs font-medium px-2.5 py-1 rounded-full bg-white/90">${cat?.emoji} ${cat?.name}</span>
            </div>
            <div class="p-5">
              <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="font-semibold leading-snug">${g.title}</h3>
                <span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-700">${g.difficulty}</span>
              </div>
              <p class="text-sm text-slate-500 mb-4 line-clamp-2">${g.description}</p>
              <div class="flex gap-4 text-xs text-slate-500">
                <span><i class="fa-regular fa-clock mr-1"></i>${g.totalTime}</span>
                <span><i class="fa-solid fa-list-ol mr-1"></i>${g.steps.length} steps</span>
              </div>
            </div>
          </article>`;
      }).join('');
}

function filterByCategory(id) {
  activeCategory = activeCategory === id ? null : id;
  renderCategories();
  renderGuides(activeCategory ? guides.filter(g => g.category === activeCategory) : guides);
}

function handleSearch(q) {
  activeCategory = null;
  renderCategories();
  q = q.toLowerCase().trim();
  if (!q) return renderGuides(guides);
  renderGuides(guides.filter(g => 
    g.title.toLowerCase().includes(q) || 
    g.description.toLowerCase().includes(q) || 
    g.location.toLowerCase().includes(q)
  ));
}

function openGuide(id) {
  const g = guides.find(x => x.id === id);
  if (!g) return;
  const cat = categories.find(c => c.id === g.category);

  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('guidePage').classList.remove('hidden');
  window.scrollTo(0, 0);

  document.getElementById('guideDetail').innerHTML = `
    <div class="relative h-52 sm:h-64 rounded-2xl overflow-hidden mb-6 shadow-lg">
      <img src="${g.image}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800&q=80'">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4">
        <div class="flex flex-wrap gap-2 mb-2">
          <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white/90">${cat?.emoji} ${cat?.name}</span>
          <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-400/90 text-amber-900">${g.difficulty}</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white">${g.title}</h1>
      </div>
    </div>

    <p class="text-slate-600 mb-4">${g.description}</p>
    <div class="flex flex-wrap gap-4 text-sm text-slate-500 mb-8">
      <span><i class="fa-regular fa-clock mr-1.5"></i>${g.totalTime}</span>
      <span><i class="fa-solid fa-location-dot mr-1.5"></i>${g.location}</span>
      <span><i class="fa-solid fa-list-ol mr-1.5"></i>${g.steps.length} steps</span>
    </div>

    <div class="bg-gradient-to-br from-teal-50 to-emerald-50 rounded-2xl h-32 mb-8 flex items-center justify-center border border-teal-100">
      <div class="text-center">
        <i class="fa-solid fa-map-location-dot text-2xl text-teal-500 mb-1"></i>
        <p class="text-sm font-medium text-teal-800">Map & live directions</p>
        <p class="text-xs text-teal-600">Coming soon</p>
      </div>
    </div>

    <h2 class="text-lg font-bold mb-5">Step-by-step sequence</h2>
    <div class="space-y-0">
      ${g.steps.map((s, i) => `
        <div class="flex gap-4 relative">
          ${i < g.steps.length - 1 ? '<div class="absolute left-[17px] top-10 bottom-0 w-0.5 bg-slate-200"></div>' : ''}
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-teal-500 to-emerald-600 text-white text-sm font-bold flex items-center justify-center shrink-0 z-10 shadow-md">${i+1}</div>
          <div class="flex-1 pb-7">
            <div class="flex items-start justify-between gap-3 mb-1">
              <h3 class="font-semibold">${s.title}</h3>
              <span class="text-xs text-slate-400">${s.time}</span>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed mb-2">${s.detail}</p>
            ${s.tip ? `<div class="bg-amber-50 text-amber-900 text-xs rounded-xl px-3 py-2.5 flex gap-2 border border-amber-100"><i class="fa-solid fa-lightbulb mt-0.5 text-amber-500"></i><span>${s.tip}</span></div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>

    <div class="mt-6 pt-6 border-t border-slate-200">
      <h3 class="font-bold mb-3">Live updates from users</h3>
      <div class="bg-slate-50 rounded-2xl p-5 text-center border border-slate-100 text-sm text-slate-500">
        No recent updates yet. Be the first to share if the place is open or has issues.
      </div>
    </div>
  `;
}

function showHome() {
  document.getElementById('guidePage').classList.add('hidden');
  document.getElementById('homePage').classList.remove('hidden');
  window.scrollTo(0, 0);
}

function openAuth(mode) {
  const isLogin = mode === 'login';
  const box = document.getElementById('authBox');
  box.innerHTML = `
    <button onclick="closeAuth()" class="absolute top-4 right-4 w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center mx-auto mb-3 shadow-md">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12h2.5l2-5 3 10 2.5-6.5L16.5 12H20" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="text-xl font-bold">${isLogin ? 'Welcome back' : 'Create your account'}</h2>
      <p class="text-sm text-slate-500 mt-1">${isLogin ? 'Sign in to save guides' : 'Save guides and track progress'}</p>
    </div>
    <form onsubmit="handleAuth(event)" class="space-y-4">
      ${!isLogin ? `<div><label class="block text-sm font-medium mb-1">Full name</label><input type="text" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500/40" placeholder="Your name"></div>` : ''}
      <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500/40" placeholder="you@example.com"></div>
      <div><label class="block text-sm font-medium mb-1">Password</label><input type="password" required minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500/40" placeholder="••••••••"></div>
      <button type="submit" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 text-white py-3 rounded-xl font-semibold">${isLogin ? 'Sign In' : 'Create Account'}</button>
      <p class="text-center text-sm text-slate-500">
        ${isLogin ? "Don’t have an account?" : "Already have an account?"}
        <button type="button" onclick="openAuth('${isLogin ? 'signup' : 'login'}')" class="text-teal-600 font-medium hover:underline">${isLogin ? 'Sign up' : 'Sign in'}</button>
      </p>
    </form>
  `;
  const modal = document.getElementById('authModal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeAuth() {
  document.getElementById('authModal').style.display = 'none';
  document.body.style.overflow = '';
}

function handleAuth(e) {
  e.preventDefault();
  alert('This is a preview website.\n\nReal Sign In / Sign Up will work when we connect a backend later.\n\nFor now you can freely read all guides without an account.');
  closeAuth();
}

// Init
renderCategories();
renderGuides(guides);
</script>
</body>
</html>
